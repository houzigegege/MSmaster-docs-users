site_name: "MSmaster: Metabolomics Network Analysis Platform"
site_description: MSmaster is an academic metabolomics platform for FMN, MR-FMN, MS/MS annotation, and traceable molecular network analysis.
# GitHub Pages 部署后请取消下一行注释并改成你的真实地址（搜索/站点地图需要）：
# 项目仓库：https://<用户名>.github.io/<仓库名>/
# 用户页仓库 <用户名>.github.io： https://<用户名>.github.io/
site_url: https://spectroai.github.io/MSmaster/

theme:
  name: material
  language: en
  # MSmaster logo in the top header.
  logo: Figures/msmaster-logo.png
  # Professional, publication-like contrast in both light/dark modes.
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/lightbulb
        name: Switch to light mode
  # Keep reading lines comfortable on large screens.
  typography:
    body: 1rem
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.integrate
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - pymdownx.highlight
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.tasklist

extra_css:
  - overrides.css
nav:
  - Home: index.md
  - About MSmaster: manual/section_01.md
  - Install MSmaster: manual/section_02.md
  - MSmaster modules: manual/section_03.md
  - Quick Start: manual/section_04.md
  - Fusion Molecular Networks (FMN): manual/section_05.md
  - Metabolic Reaction Fusion Molecular Networks (MR-FMN): manual/section_06.md
